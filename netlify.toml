# Next.js inlines NEXT_PUBLIC_* environment variables into the client bundle by
# design. The PostHog project key and host are public client-side values, not
# secrets, so exclude them from Netlify secrets scanning. Without this, the
# scanner finds the inlined key in the build output and fails the deploy.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_POSTHOG_KEY,NEXT_PUBLIC_POSTHOG_HOST"
