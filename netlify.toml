# Next.js inlines NEXT_PUBLIC_* environment variables into the client bundle by
# design. The PostHog project key and host are public client-side values, not
# secrets. Netlify secrets scanning flags the inlined key and fails the deploy,
# so disable it here. Secret detection is still covered by GitGuardian on the repo.
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
